name: Create Release Tag

on:
  push:
    branches: [release]

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Create next minor release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push next minor tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | while read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "$tag"
              break
            fi
          done)"

          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=0
          else
            [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
          fi

          next_tag="v${major}.$((10#$minor + 1)).0"
          if git ls-remote --exit-code --refs origin "refs/tags/$next_tag" >/dev/null 2>&1; then
            echo "Tag '$next_tag' already exists on origin; refusing to overwrite it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next_tag" "$GITHUB_SHA" --message "Release $next_tag"
          git push origin "refs/tags/$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Created and pushed $next_tag from $GITHUB_SHA"

      - name: Start release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref release -f tag="${{ steps.version.outputs.tag }}"
