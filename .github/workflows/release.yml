name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

jobs:
  native-tests:
    name: Release tests (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate package and run tests
        run: |
          swift package dump-package >/dev/null
          swift test

  release:
    needs: native-tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must use semantic versioning, for example v1.2.0: $TAG" >&2
            exit 1
          }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate packaging files
        shell: bash
        run: |
          bash -n Scripts/*.sh
          plutil -lint Packaging/Info.plist Packaging/Countpane.entitlements

      - name: Build native DMGs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./Scripts/build-dmg.sh "${{ steps.version.outputs.version }}" arm64
          ./Scripts/build-dmg.sh "${{ steps.version.outputs.version }}" x86_64

      - name: Verify native binaries and signatures
        shell: bash
        run: |
          for ARCH in arm64 x86_64; do
            APP="dist/Countpane-${ARCH}.app"
            ARCHS="$(lipo -archs "$APP/Contents/MacOS/Countpane")"
            echo "$ARCH architectures: $ARCHS"
            [[ "$ARCHS" == "$ARCH" ]]
            test -f "$APP/Contents/Resources/AppIcon.icns"
            test ! -e "$APP/Contents/Resources/AppIcon.png"
            test ! -e "$APP/Contents/Resources/Countpane_Countpane.bundle"
            codesign --verify --deep --strict --verbose=2 "$APP"
            test -f "dist/Countpane-${ARCH}.dSYM/Contents/Resources/DWARF/Countpane"
            diff -u <(xcrun dwarfdump --uuid "$APP/Contents/MacOS/Countpane" | awk '/^UUID:/ { print $2 }' | sort) <(xcrun dwarfdump --uuid "dist/Countpane-${ARCH}.dSYM" | awk '/^UUID:/ { print $2 }' | sort)
          done

      - name: Verify disk images
        shell: bash
        run: |
          hdiutil verify "dist/Countpane-${{ steps.version.outputs.version }}-arm64.dmg"
          hdiutil verify "dist/Countpane-${{ steps.version.outputs.version }}-x86_64.dmg"

      - name: Measure release size
        run: |
          ./Scripts/measure-distribution-size.sh --architecture arm64 --max-application-bytes 5400000 --max-executable-bytes 3600000 --max-dmg-bytes 3000000 "dist/Countpane-arm64.app" "dist/Countpane-${{ steps.version.outputs.version }}-arm64.dmg"
          ./Scripts/measure-distribution-size.sh --architecture x86_64 --max-application-bytes 5400000 --max-executable-bytes 3600000 --max-dmg-bytes 3000000 "dist/Countpane-x86_64.app" "dist/Countpane-${{ steps.version.outputs.version }}-x86_64.dmg"

      - name: Render Homebrew cask
        id: cask
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARM_DMG="dist/Countpane-${VERSION}-arm64.dmg"
          INTEL_DMG="dist/Countpane-${VERSION}-x86_64.dmg"
          ARM_SHA256="$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')"
          INTEL_SHA256="$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')"
          ./Scripts/render-cask.sh "$VERSION" "$ARM_SHA256" "$INTEL_SHA256" "$GITHUB_REPOSITORY" "dist/countpane.rb"

      - name: Validate Homebrew cask
        env:
          VALIDATION_TAP: local/countpane-validation-${{ github.run_id }}
        run: |
          set -euo pipefail
          brew tap-new --no-git "$VALIDATION_TAP"
          VALIDATION_TAP_PATH="$(brew --repository)/Library/Taps/local/homebrew-countpane-validation-${GITHUB_RUN_ID}"
          mkdir -p "$VALIDATION_TAP_PATH/Casks"
          cp dist/countpane.rb "$VALIDATION_TAP_PATH/Casks/countpane.rb"
          brew style --cask "$VALIDATION_TAP/countpane"
          brew audit --cask --skip-style "$VALIDATION_TAP/countpane"
          brew untap --force "$VALIDATION_TAP"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Countpane-${{ steps.version.outputs.version }}
          path: |
            dist/Countpane-${{ steps.version.outputs.version }}-arm64.dmg
            dist/Countpane-${{ steps.version.outputs.version }}-arm64.dmg.sha256
            dist/Countpane-${{ steps.version.outputs.version }}-x86_64.dmg
            dist/Countpane-${{ steps.version.outputs.version }}-x86_64.dmg.sha256
            dist/countpane.rb
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSETS=(
            "dist/Countpane-${VERSION}-arm64.dmg"
            "dist/Countpane-${VERSION}-arm64.dmg.sha256"
            "dist/Countpane-${VERSION}-x86_64.dmg"
            "dist/Countpane-${VERSION}-x86_64.dmg.sha256"
            "dist/countpane.rb"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Countpane ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Update Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          TAP_REPOSITORY="sashplatonov/homebrew-apps"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Casks
          cp dist/countpane.rb tap/Casks/countpane.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/countpane.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already current."
          else
            git commit -m "Update Countpane to ${{ steps.version.outputs.version }}"
            git push
          fi
